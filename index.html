<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chess Master</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chess.js library (stable v0.10.3 global constructor version) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html, body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overscroll-behavior-y: contain;
            min-height: 100dvh;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
        }

        /* Custom Scrollbars (Desktop & Android WebView) */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.22);
            border-radius: 4px;
        }

        /* Responsive Board Sizing for Android Portrait & Desktop */
        .board-wrapper {
            width: min(94vw, 540px, 60dvh);
            max-width: 100%;
        }

        @media (min-width: 1024px) {
            .board-wrapper {
                width: min(560px, 72dvh);
            }
        }

        /* Chess Board Styles */
        .board-square {
            position: relative;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.12s ease;
        }

        .piece {
            width: 86%;
            height: 86%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Desktop-only hover feedback (prevents sticky hover on Android) */
        @media (hover: hover) and (pointer: fine) {
            .board-square:hover .piece {
                transform: scale(1.07);
            }
        }

        .board-square:active .piece {
            transform: scale(0.95);
        }

        /* Move highlight overlay */
        .possible-move::after {
            content: '';
            position: absolute;
            width: 28%;
            height: 28%;
            background-color: rgba(0, 0, 0, 0.24);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }
        .dark-square.possible-move::after {
            background-color: rgba(255, 255, 255, 0.36);
        }

        .capture-move::after {
            content: '';
            position: absolute;
            width: 86%;
            height: 86%;
            border: 3.5px solid rgba(239, 68, 68, 0.78);
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
        }

        .last-move-highlight {
            background-color: rgba(254, 240, 138, 0.45) !important;
        }

        .in-check-highlight {
            background-color: rgba(239, 68, 68, 0.58) !important;
        }

        /* Themes */
        .theme-wood .light-square { background-color: #f0d9b5; color: #b58863; }
        .theme-wood .dark-square { background-color: #b58863; color: #f0d9b5; }
        
        .theme-slate .light-square { background-color: #e2e8f0; color: #475569; }
        .theme-slate .dark-square { background-color: #64748b; color: #e2e8f0; }

        .theme-emerald .light-square { background-color: #e8edd9; color: #779952; }
        .theme-emerald .dark-square { background-color: #779952; color: #e8edd9; }

        .theme-ocean .light-square { background-color: #dee3e6; color: #4b7399; }
        .theme-ocean .dark-square { background-color: #4b7399; color: #dee3e6; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col justify-between overflow-x-hidden">

    <!-- PAGE 1: SETTINGS PAGE -->
    <div id="settings-page" class="min-h-[100dvh] flex flex-col justify-between p-4 sm:p-8 max-w-4xl mx-auto w-full transition-all duration-300">
        <!-- Header -->
        <header class="text-center my-4 sm:my-6">
            <div class="inline-flex items-center justify-center space-x-3 mb-2">
                <i class="fa-solid fa-chess-king text-amber-500 text-3xl sm:text-4xl"></i>
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">
                    CHESS MASTER
                </h1>
            </div>
            <p class="text-slate-400 text-xs sm:text-base">Configure your game preferences and start playing</p>
        </header>

        <!-- Main Options Form -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 bg-slate-900/85 border border-slate-800 backdrop-blur-md p-5 sm:p-8 rounded-2xl shadow-2xl">
            
            <!-- Game Mode Selector -->
            <div class="space-y-2.5">
                <label class="block text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-400">Game Mode</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="mode-ai-btn" onclick="setGameMode('ai')" class="min-h-[48px] flex items-center justify-center space-x-2 p-3.5 rounded-xl border border-amber-500/50 bg-amber-500/10 text-amber-400 font-medium active:scale-[0.98] transition-all">
                        <i class="fa-solid fa-robot"></i>
                        <span>VS AI</span>
                    </button>
                    <button type="button" id="mode-pvp-btn" onclick="setGameMode('pvp')" class="min-h-[48px] flex items-center justify-center space-x-2 p-3.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-medium hover:border-slate-600 active:scale-[0.98] transition-all">
                        <i class="fa-solid fa-user-group"></i>
                        <span>2 Player</span>
                    </button>
                </div>
            </div>

            <!-- Side Selection (AI Mode Only) -->
            <div id="side-select-container" class="space-y-2.5">
                <label class="block text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-400">Play As</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="side-white-btn" onclick="setPlayerSide('w')" class="min-h-[48px] flex items-center justify-center space-x-2 p-3.5 rounded-xl border border-amber-500/50 bg-amber-500/10 text-amber-400 font-medium active:scale-[0.98] transition-all">
                        <i class="fa-solid fa-chess-pawn text-slate-200"></i>
                        <span>White</span>
                    </button>
                    <button type="button" id="side-black-btn" onclick="setPlayerSide('b')" class="min-h-[48px] flex items-center justify-center space-x-2 p-3.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-medium hover:border-slate-600 active:scale-[0.98] transition-all">
                        <i class="fa-solid fa-chess-pawn text-slate-900"></i>
                        <span>Black</span>
                    </button>
                </div>
            </div>

            <!-- AI Difficulty Selector -->
            <div id="ai-diff-container" class="space-y-2.5">
                <label class="block text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-400">AI Difficulty</label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" id="diff-easy-btn" onclick="setAIDifficulty('easy')" class="min-h-[48px] p-3 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-medium text-sm hover:border-slate-600 active:scale-[0.98] transition-all">Easy</button>
                    <button type="button" id="diff-medium-btn" onclick="setAIDifficulty('medium')" class="min-h-[48px] p-3 rounded-xl border border-amber-500/50 bg-amber-500/10 text-amber-400 font-medium text-sm active:scale-[0.98] transition-all">Medium</button>
                    <button type="button" id="diff-hard-btn" onclick="setAIDifficulty('hard')" class="min-h-[48px] p-3 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 font-medium text-sm hover:border-slate-600 active:scale-[0.98] transition-all">Hard</button>
                </div>
            </div>

            <!-- Board Theme Selector -->
            <div class="space-y-2.5">
                <label class="block text-xs sm:text-sm font-semibold uppercase tracking-wider text-slate-400">Board Theme</label>
                <select id="board-theme-select" onchange="setBoardTheme(this.value)" class="min-h-[48px] w-full p-3.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 font-medium focus:outline-none focus:border-amber-500">
                    <option value="wood">Classic Wood</option>
                    <option value="emerald">Emerald Green</option>
                    <option value="slate">Slate Gray</option>
                    <option value="ocean">Ocean Blue</option>
                </select>
            </div>

            <!-- Sound Toggle -->
            <label for="sound-toggle" class="min-h-[64px] flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700/60 rounded-xl cursor-pointer active:bg-slate-800 transition-colors">
                <div class="flex items-center space-x-3">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-amber-400 text-xl w-6 text-center"></i>
                    <div>
                        <span class="block font-medium text-slate-200 text-sm sm:text-base">Sound Effects</span>
                        <span class="text-xs text-slate-400">Audio feedback on moves</span>
                    </div>
                </div>
                <div class="relative inline-flex items-center">
                    <input type="checkbox" id="sound-toggle" checked onchange="toggleSound(this.checked)" class="sr-only peer">
                    <div class="w-12 h-7 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-amber-500"></div>
                </div>
            </label>

            <!-- Flip Board Toggle -->
            <label for="flip-toggle" class="min-h-[64px] flex items-center justify-between p-4 bg-slate-800/60 border border-slate-700/60 rounded-xl cursor-pointer active:bg-slate-800 transition-colors">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-rotate text-amber-400 text-xl w-6 text-center"></i>
                    <div>
                        <span class="block font-medium text-slate-200 text-sm sm:text-base">Flip Board View</span>
                        <span class="text-xs text-slate-400">Reverse default board orientation</span>
                    </div>
                </div>
                <div class="relative inline-flex items-center">
                    <input type="checkbox" id="flip-toggle" onchange="toggleFlipBoard(this.checked)" class="sr-only peer">
                    <div class="w-12 h-7 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-amber-500"></div>
                </div>
            </label>

        </div>

        <!-- Action Button -->
        <div class="mt-6 mb-2 sm:mt-8 sm:mb-4">
            <button onclick="startGame()" class="min-h-[56px] w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-lg sm:text-xl shadow-lg shadow-amber-500/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-3">
                <i class="fa-solid fa-play"></i>
                <span>PLAY GAME</span>
            </button>
        </div>
    </div>


    <!-- PAGE 2: GAME BOARD PAGE (Hidden by default) -->
    <div id="game-page" class="hidden min-h-[100dvh] flex flex-col justify-between items-center bg-slate-950">
        
        <!-- Header Bar -->
        <header class="w-full bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-6 py-2.5 flex items-center justify-between z-20">
            <button onclick="returnToSettings()" class="min-h-[42px] min-w-[42px] flex items-center justify-center space-x-2 text-slate-300 hover:text-slate-100 bg-slate-800 hover:bg-slate-700 active:scale-95 px-3.5 py-2 rounded-xl text-sm font-medium transition-all">
                <i class="fa-solid fa-gear"></i>
                <span class="hidden sm:inline">Settings</span>
            </button>

            <div class="flex items-center space-x-2">
                <div id="game-status-indicator" class="flex items-center space-x-2 bg-slate-800/90 px-3.5 py-1.5 rounded-full border border-slate-700">
                    <span id="turn-dot" class="w-3 h-3 rounded-full bg-slate-100 inline-block shadow"></span>
                    <span id="status-text" class="text-xs sm:text-sm font-semibold tracking-wide text-slate-200">White's Turn</span>
                </div>
            </div>

            <button id="toggle-history-btn" onclick="toggleHistoryTab()" class="min-h-[42px] min-w-[42px] flex items-center justify-center space-x-2 text-slate-300 hover:text-slate-100 bg-slate-800 hover:bg-slate-700 active:scale-95 px-3.5 py-2 rounded-xl text-sm font-medium transition-all">
                <i class="fa-solid fa-list-ol"></i>
                <span class="hidden sm:inline">History</span>
            </button>
        </header>

        <!-- Main Board Area & Side Panel Container -->
        <main class="flex-1 flex flex-col lg:flex-row items-center justify-center w-full max-w-6xl px-2 py-2 sm:p-6 gap-4 lg:gap-8 relative">
            
            <!-- Chess Board Box -->
            <div class="board-wrapper flex flex-col items-center">
                <!-- Captured Pieces Opponent -->
                <div id="captured-top" class="w-full flex items-center justify-between min-h-[28px] px-1.5 mb-1 text-slate-400 text-xs sm:text-sm">
                    <div class="flex items-center space-x-1.5" id="top-player-info">
                        <span class="font-semibold text-slate-300 truncate max-w-[160px]" id="top-player-name">Opponent</span>
                    </div>
                    <div id="captured-by-top" class="flex flex-wrap justify-end gap-0.5"></div>
                </div>

                <!-- Board Container -->
                <div class="relative w-full aspect-square rounded-xl overflow-hidden shadow-2xl border-2 sm:border-4 border-slate-800/90">
                    <div id="chess-board" class="grid grid-cols-8 grid-rows-8 w-full h-full theme-wood">
                        <!-- Squares dynamically created in JS -->
                    </div>

                    <!-- Overlay for Promotion -->
                    <div id="promotion-modal" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-sm z-30 flex flex-col items-center justify-center space-y-4 p-4">
                        <h3 class="text-slate-100 font-bold text-base sm:text-lg">Choose Promotion</h3>
                        <div id="promotion-choices" class="flex space-x-2.5 sm:space-x-3 bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-xl">
                            <!-- Dynamically generated pieces -->
                        </div>
                    </div>

                    <!-- Overlay for Game Over -->
                    <div id="game-over-modal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md z-40 flex flex-col items-center justify-center p-4 sm:p-6 text-center">
                        <div class="bg-slate-900 border border-slate-800 p-5 sm:p-8 rounded-2xl max-w-sm w-full shadow-2xl space-y-3 sm:space-y-4">
                            <i id="game-over-icon" class="fa-solid fa-trophy text-amber-400 text-4xl sm:text-5xl mb-1"></i>
                            <h2 id="game-over-title" class="text-xl sm:text-2xl font-bold text-slate-100">Checkmate!</h2>
                            <p id="game-over-reason" class="text-slate-400 text-xs sm:text-sm">White won by checkmate.</p>
                            <div class="pt-3 flex flex-col space-y-2.5">
                                <button onclick="enterReplayMode()" class="min-h-[46px] w-full py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] border border-amber-500/40 text-amber-400 font-semibold rounded-xl transition-all flex items-center justify-center space-x-2 text-sm">
                                    <i class="fa-solid fa-film"></i>
                                    <span>Review / Replay Game</span>
                                </button>
                                <button onclick="restartGame()" class="min-h-[46px] w-full py-2.5 bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-slate-950 font-bold rounded-xl transition-all text-sm">Play Again</button>
                                <button onclick="returnToSettings()" class="min-h-[46px] w-full py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-300 font-semibold rounded-xl transition-all text-sm">Settings</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Captured Pieces Player -->
                <div id="captured-bottom" class="w-full flex items-center justify-between min-h-[28px] px-1.5 mt-1 text-slate-400 text-xs sm:text-sm">
                    <div class="flex items-center space-x-1.5" id="bottom-player-info">
                        <span class="font-semibold text-slate-300 truncate max-w-[160px]" id="bottom-player-name">You</span>
                    </div>
                    <div id="captured-by-bottom" class="flex flex-wrap justify-end gap-0.5"></div>
                </div>

                <!-- Replay Controls Bar (Touch-Friendly 44px Targets) -->
                <div id="replay-bar" class="hidden w-full mt-2 bg-slate-900/90 border border-slate-800 rounded-xl p-2 flex items-center justify-between gap-1.5 shadow-lg">
                    <div class="flex items-center space-x-1">
                        <button onclick="replayJumpStart()" title="Start of Game" class="w-10 h-10 sm:w-9 sm:h-9 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-backward-fast text-xs"></i>
                        </button>
                        <button onclick="replayStepBack()" title="Previous Move (Left Arrow)" class="w-10 h-10 sm:w-9 sm:h-9 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-backward-step text-xs"></i>
                        </button>
                        <button id="replay-play-btn" onclick="toggleReplayAutoPlay()" title="Auto-Play Replay" class="w-11 h-10 sm:w-10 sm:h-9 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 active:scale-95 border border-amber-500/40 text-amber-400 flex items-center justify-center transition-all">
                            <i id="replay-play-icon" class="fa-solid fa-play text-xs"></i>
                        </button>
                        <button onclick="replayStepForward()" title="Next Move (Right Arrow)" class="w-10 h-10 sm:w-9 sm:h-9 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-forward-step text-xs"></i>
                        </button>
                        <button onclick="replayJumpEnd()" title="Latest Position" class="w-10 h-10 sm:w-9 sm:h-9 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-forward-fast text-xs"></i>
                        </button>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span id="replay-step-label" class="text-[11px] sm:text-xs font-mono text-slate-400 px-1.5">0 / 0</span>
                        <button id="exit-replay-btn" onclick="exitReplayMode()" class="hidden min-h-[36px] px-2.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold text-xs transition-all">
                            Resume
                        </button>
                    </div>
                </div>
            </div>

            <!-- History Panel (Responsive Drawer on Mobile, Side Card on Desktop) -->
            <div id="history-panel" class="hidden lg:flex w-full max-w-[540px] lg:w-80 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex-col h-[320px] lg:h-[520px] transition-all">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                    <h3 class="font-bold text-slate-200 flex items-center space-x-2 text-sm sm:text-base">
                        <i class="fa-solid fa-clock-rotate-left text-amber-500"></i>
                        <span>Move History</span>
                    </h3>
                    <div class="flex items-center space-x-2">
                        <span id="move-count" class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-md">0 moves</span>
                        <button onclick="toggleHistoryTab()" class="lg:hidden w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>
                
                <div id="move-history-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1 font-mono text-sm">
                    <div class="text-center text-slate-500 py-8 text-xs italic">No moves played yet</div>
                </div>

                <div class="pt-3 border-t border-slate-800 flex justify-between gap-2">
                    <button onclick="undoMove()" title="Undo Move (Ctrl+Z)" class="min-h-[44px] flex-1 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 text-xs font-semibold rounded-lg transition-all flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>Undo</span>
                    </button>
                    <button onclick="restartGame()" class="min-h-[44px] flex-1 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 text-xs font-semibold rounded-lg transition-all flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span>Restart</span>
                    </button>
                </div>
            </div>

        </main>
        <div class="h-1"></div>
    </div>

    <!-- Application Script -->
    <script>
        // --- APP STATE & CONFIGURATION ---
        const config = {
            sound: true,
            flipBoard: false,
            theme: 'wood',
            mode: 'ai', // 'ai' or 'pvp'
            aiDifficulty: 'medium', // 'easy', 'medium', 'hard'
            playerSide: 'w' // 'w' or 'b'
        };

        let game = null;
        let selectedSquare = null;
        let possibleMoves = [];
        let pendingPromotion = null;
        let isAiThinking = false;
        let aiMoveTimeout = null;

        // Replay State
        let isReplayMode = false;
        let replayIndex = 0;
        let replayAutoInterval = null;

        // Piece Vector Graphics

            [-30,-30,  0,  0,  0,  0,-30,-30],
            [-50,-30,-30,-30,-30,-30,-30,-50]
        ];

        // --- AUDIO SYNTHESIZER (Mobile-Unlocked Web Audio API) ---
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            playMove() {
                if (!config.sound) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCapture() {
                if (!config.sound) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playCheck() {
                if (!config.sound) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playGameOver() {
                if (!config.sound) return;
                this.init();
                if (!this.ctx) return;
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.2);
                });
            }
        }

        function buildReplayInstance(targetStep) {
            const tempGame = new Chess();
            const fullHistory = game.history({ verbose: true });
            const limit = Math.max(0, Math.min(targetStep, fullHistory.length));
            for (let i = 0; i < limit; i++) {
                tempGame.move(fullHistory[i]);
            }
            return tempGame;
        }

        function enterReplayMode(stepIndex = null) {
            const totalMoves = game.history().length;
            if (totalMoves === 0) return;

            document.getElementById('game-over-modal').classList.add('hidden');
            isReplayMode = true;
            selectedSquare = null;
            possibleMoves = [];
            replayIndex = stepIndex !== null ? stepIndex : totalMoves;

            renderBoard();
            updateUI();
        }

        function exitReplayMode() {
            stopReplayAutoPlay();
            isReplayMode = false;
            replayIndex = game.history().length;
            selectedSquare = null;
            possibleMoves = [];

            renderBoard();
            updateUI();

            if (game.game_over()) {
                document.getElementById('game-over-modal').classList.remove('hidden');
            }
        }

        function replayJumpStart() {
            const total = game.history().length;
            if (total === 0) return;
            stopReplayAutoPlay();
            if (!isReplayMode) isReplayMode = true;
            replayIndex = 0;
            renderBoard();
            updateUI();
        }

        function replayStepBack() {
            const total = game.history().length;
            if (total === 0) return;
            stopReplayAutoPlay();
            if (!isReplayMode) {
                isReplayMode = true;
                replayIndex = Math.max(0, total - 1);
            } else {
                replayIndex = Math.max(0, replayIndex - 1);
            }
            audio.playMove();
            renderBoard();
            updateUI();
        }

        function replayStepForward() {
            const total = game.history().length;
            if (!isReplayMode || replayIndex >= total) {
                stopReplayAutoPlay();
                return;
            }
            replayIndex++;
            const hist = game.history({ verbose: true });
            const move = hist[replayIndex - 1];
            if (move && move.captured) audio.playCapture();
            else audio.playMove();

            renderBoard();
            updateUI();

            if (replayIndex >= total) {
                stopReplayAutoPlay();
            }
        }

        function replayJumpEnd() {
            const total = game.history().length;
            if (total === 0) return;
            stopReplayAutoPlay();
            replayIndex = total;
            if (!game.game_over()) {
                exitReplayMode();
            } else {
                renderBoard();
                updateUI();
            }
        }

        function toggleReplayAutoPlay() {
            const total = game.history().length;
            if (total === 0) return;

            if (replayAutoInterval) {
                stopReplayAutoPlay();
                return;
            }

            if (!isReplayMode || replayIndex >= total) {
                isReplayMode = true;
                replayIndex = 0;
                renderBoard();
                updateUI();
            }

            document.getElementById('replay-play-icon').className = 'fa-solid fa-pause text-xs';
            replayAutoInterval = setInterval(() => {
                if (replayIndex < game.history().length) {
                    replayStepForward();
                } else {
                    stopReplayAutoPlay();
                }
            }, 850);
        }

        function stopReplayAutoPlay() {
            if (replayAutoInterval) {
                clearInterval(replayAutoInterval);
                replayAutoInterval = null;
            }
            const icon = document.getElementById('replay-play-icon');
            if (icon) icon.className = 'fa-solid fa-play text-xs';
        }

        function renderBoard() {
            const boardContainer = document.getElementById('chess-board');
            boardContainer.innerHTML = '';

            const activeBoardGame = isReplayMode ? buildReplayInstance(replayIndex) : game;
            const flipped = isBoardFlipped();
            const rows = flipped ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const cols = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];

            const boardState = activeBoardGame.board();
            const verboseHistory = activeBoardGame.history({ verbose: true });
            const lastMove = verboseHistory.length > 0 ? verboseHistory[verboseHistory.length - 1] : null;

            rows.forEach(r => {
                cols.forEach(c => {
                    const squareName = String.fromCharCode(97 + c) + (r + 1);
                    const piece = boardState[7 - r][c];

                    const squareDiv = document.createElement('div');
                    const isDark = (r + c) % 2 === 0;
                    squareDiv.className = `board-square ${isDark ? 'dark-square' : 'light-square'}`;
                    squareDiv.dataset.square = squareName;

                    if ((flipped ? r === 7 : r === 0)) {
                        const fileLabel = document.createElement('span');
                        fileLabel.className = 'absolute bottom-0.5 right-1 text-[9px] sm:text-[10px] font-bold opacity-75 pointer-events-none';
                        fileLabel.innerText = String.fromCharCode(97 + c);
                        squareDiv.appendChild(fileLabel);
                    }
                    if ((flipped ? c === 7 : c === 0)) {
                        const rankLabel = document.createElement('span');
                        rankLabel.className = 'absolute top-0.5 left-1 text-[9px] sm:text-[10px] font-bold opacity-75 pointer-events-none';
                        rankLabel.innerText = r + 1;
                        squareDiv.appendChild(rankLabel);
                    }

                    if (!isReplayMode && selectedSquare === squareName) {
                        squareDiv.classList.add('bg-amber-400/50');
                    }

                    if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
                        squareDiv.classList.add('last-move-highlight');
                    }

                    if (activeBoardGame.in_check() && piece && piece.type === 'k' && piece.color === activeBoardGame.turn()) {
                        squareDiv.classList.add('in-check-highlight');
                    }

                    if (!isReplayMode) {
                        const isPossible = possibleMoves.find(m => m.to === squareName);
                        if (isPossible) {
                            if (isPossible.captured) {
                                squareDiv.classList.add('capture-move');
                            } else {
                                squareDiv.classList.add('possible-move');
                            }
                        }
                    }

                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = 'piece';
                        pieceDiv.style.backgroundImage = `url('${pieceSvgs[piece.color][piece.type]}')`;
                        squareDiv.appendChild(pieceDiv);
                    }

                    squareDiv.onclick = () => handleSquareClick(squareName);
                    boardContainer.appendChild(squareDiv);
                });
            });
        }

        function handleSquareClick(square) {
            if (isReplayMode || isAiThinking || game.game_over()) return;

            if (config.mode === 'ai' && game.turn() !== config.playerSide) return;

            const pieceOnSquare = game.get(square);

            if (selectedSquare) {
                const moveCandidate = possibleMoves.find(m => m.to === square);

                if (moveCandidate) {
                    if (moveCandidate.flags.includes('p') || (moveCandidate.piece === 'p' && (square[1] === '8' || square[1] === '1'))) {
                        pendingPromotion = { from: selectedSquare, to: square };
                        showPromotionModal(game.turn());
                        return;
                    }

                    executeMove({ from: selectedSquare, to: square });
                    selectedSquare = null;
                    possibleMoves = [];
                    return;
                }
            }

            if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
                selectedSquare = square;
                possibleMoves = game.moves({ square: square, verbose: true });
            } else {
                selectedSquare = null;
                possibleMoves = [];
            }

            renderBoard();
        }

        function executeMove(moveObj) {
            const moveResult = game.move(moveObj);
            if (moveResult) {
                replayIndex = game.history().length;

                if (moveResult.captured) {
                    audio.playCapture();
                } else {
                    audio.playMove();
                }

                if (game.in_check()) {
                    audio.playCheck();
                }

                renderBoard();
                updateUI();

                if (game.game_over()) {
                    handleGameOver();
                    return;
                }

                if (config.mode === 'ai' && game.turn() !== config.playerSide) {
                    triggerAIMove();
                }
            }
        }

        function triggerAIMove() {
            isAiThinking = true;
            updateUI();
            aiMoveTimeout = setTimeout(async () => {
                await makeAIMove();
                isAiThinking = false;

        function showPromotionModal(color) {

                btn.onclick = () => {

        // --- UPGRADED AI WITH ONLINE OPENING DATABASE INTEGRATION ---
        async function makeAIMove() {
            if (game.game_over()) return;

            // Query Lichess Opening Explorer API with 2.5s timeout so offline/slow Android networks never hang
            try {
                const fen = game.fen();
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);
                const response = await fetch(`https://explorer.lichess.ovh/standard?fen=${encodeURIComponent(fen)}&topGames=0`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.moves && data.moves.length > 0) {
                        const topMoves = data.moves.slice(0, Math.min(3, data.moves.length));
                        const chosenOpeningMove = topMoves[Math.floor(Math.random() * topMoves.length)];
                        if (chosenOpeningMove && chosenOpeningMove.uci) {
                            const from = chosenOpeningMove.uci.substring(0, 2);
                            const to = chosenOpeningMove.uci.substring(2, 4);
                            const promotion = chosenOpeningMove.uci.length > 4 ? chosenOpeningMove.uci[4] : undefined;
                            const moveResult = game.move({ from, to, promotion });
                            if (moveResult) {
                                replayIndex = game.history().length;
                                if (moveResult.captured) audio.playCapture();
                                else audio.playMove();
                                if (game.in_check()) audio.playCheck();
                                renderBoard();
                                updateUI();
                                if (game.game_over()) handleGameOver();
                                return;
                            }
                        }
                    }
                }
            } catch (e) {
                // Fallback seamlessly to local minimax engine
            }

            const moves = orderMoves(game.moves({ verbose: true }));
            if (moves.length === 0) return;

            const aiColor = game.turn();
            let chosenMove = null;

            if (config.aiDifficulty === 'easy') {
                if (Math.random() < 0.4) {
                    chosenMove = moves[0];
                } else {
                    chosenMove = moves[Math.floor(Math.random() * moves.length)];
                }
            } else {
                const searchDepth = config.aiDifficulty === 'medium' ? 2 : 3;
                const useQuiescence = config.aiDifficulty === 'hard';

                let bestScore = -Infinity;
                let bestMoves = [];

                for (let move of moves) {
                    game.move(move);
                    let score = minimax(searchDepth - 1, -Infinity, Infinity, false, aiColor, useQuiescence);
                    if (score > 90000) score += searchDepth;
                    game.undo();

                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [move];
                    } else if (score === bestScore) {
                        bestMoves.push(move);
                    }
                }
                chosenMove = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            if (chosenMove) {
                executeMove(chosenMove);
            }
        }

        function orderMoves(moves) {
            return moves.sort((a, b) => scoreMoveHeuristic(b) - scoreMoveHeuristic(a));
        }

        function scoreMoveHeuristic(move) {
            let score = 0;
            if (move.captured) {
                score += 10 * PIECE_VALUES[move.captured] - PIECE_VALUES[move.piece];
            }
            if (move.promotion) {
                score += PIECE_VALUES[move.promotion];
            }
            if (move.san.includes('+')) score += 50;
            if (move.flags.includes('k') || move.flags.includes('q')) score += 40;
            return score;
        }

        function evaluateBoard(aiColor) {
            if (game.in_checkmate()) {
                return game.turn() === aiColor ? -99999 : 99999;
            }
            if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                return 0;
            }

            const board = game.board();
            let totalMaterialWithoutKings = 0;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p && p.type !== 'k' && p.type !== 'p') {
                        totalMaterialWithoutKings += PIECE_VALUES[p.type];
                    }
                }
            }
            const isEndgame = totalMaterialWithoutKings <= 2600;

            let whiteScore = 0;
            let blackScore = 0;
            let whiteBishops = 0;
            let blackBishops = 0;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (!piece) continue;

                    const isWhite = piece.color === 'w';
                    const tableRow = isWhite ? r : 7 - r;
                    let posBonus = 0;

                    switch (piece.type) {
                        case 'p': posBonus = PST_PAWN[tableRow][c]; break;
                        case 'n': posBonus = PST_KNIGHT[tableRow][c]; break;
                        case 'b':
                            posBonus = PST_BISHOP[tableRow][c];
                            if (isWhite) whiteBishops++; else blackBishops++;
                            break;
                        case 'r': posBonus = PST_ROOK[tableRow][c]; break;
                        case 'q': posBonus = PST_QUEEN[tableRow][c]; break;
                        case 'k':
                            posBonus = isEndgame ? PST_KING_END[tableRow][c] : PST_KING_MID[tableRow][c];
                            break;
                    }

                    const pieceTotal = PIECE_VALUES[piece.type] + posBonus;
                    if (isWhite) whiteScore += pieceTotal;
                    else blackScore += pieceTotal;
                }
            }

            if (whiteBishops >= 2) whiteScore += 35;
            if (blackBishops >= 2) blackScore += 35;

            const netEval = whiteScore - blackScore;
            return aiColor === 'w' ? netEval : -netEval;
        }

        function quiescence(alpha, beta, isMaximizing, aiColor, qDepth = 0) {
            const standPat = evaluateBoard(aiColor);
            if (qDepth >= 4) return standPat;

            if (isMaximizing) {
                if (standPat >= beta) return beta;
                if (standPat > alpha) alpha = standPat;

                const tacticalMoves = orderMoves(
                    game.moves({ verbose: true }).filter(m => m.captured || m.promotion)
                );

                for (let move of tacticalMoves) {
                    game.move(move);
                    const score = quiescence(alpha, beta, false, aiColor, qDepth + 1);
                    game.undo();

                    if (score >= beta) return beta;
                    if (score > alpha) alpha = score;
                }
                return alpha;
            } else {
                if (standPat <= alpha) return alpha;
                if (standPat < beta) beta = standPat;

                const tacticalMoves = orderMoves(
                    game.moves({ verbose: true }).filter(m => m.captured || m.promotion)
                );

                for (let move of tacticalMoves) {
                    game.move(move);
                    const score = quiescence(alpha, beta, true, aiColor, qDepth + 1);
                    game.undo();

                    if (score <= alpha) return alpha;
                    if (score < beta) beta = score;
                }
                return beta;
            }
        }

        function minimax(depth, alpha, beta, isMaximizing, aiColor, useQuiescence) {
            if (depth === 0 || game.game_over()) {
                if (useQuiescence && !game.game_over()) {
                    return quiescence(alpha, beta, isMaximizing, aiColor);
                }
                return evaluateBoard(aiColor);
            }

            const moves = orderMoves(game.moves({ verbose: true }));

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    const evaluation = minimax(depth - 1, alpha, beta, false, aiColor, useQuiescence);
                    game.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    game.move(move);
                    const evaluation = minimax(depth - 1, alpha, beta, true, aiColor, useQuiescence);
                    game.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function updateUI() {
            const activeBoardGame = isReplayMode ? buildReplayInstance(replayIndex) : game;
            const turnDot = document.getElementById('turn-dot');
            const statusText = document.getElementById('status-text');
            const isWhiteTurn = activeBoardGame.turn() === 'w';

            turnDot.className = `w-3 h-3 rounded-full inline-block shadow ${isWhiteTurn ? 'bg-slate-100' : 'bg-slate-900 border border-slate-600'}`;
            
            if (isReplayMode) {
                statusText.innerText = `Replay (${replayIndex}/${game.history().length})`;
            } else if (isAiThinking) {
                statusText.innerText = `AI Thinking...`;
            } else if (activeBoardGame.in_check()) {
                statusText.innerText = `${isWhiteTurn ? "White" : "Black"} in Check!`;
            } else {
                statusText.innerText = `${isWhiteTurn ? "White" : "Black"}'s Turn`;
            }

            const totalMoves = game.history().length;
            const replayBar = document.getElementById('replay-bar');
            const replayStepLabel = document.getElementById('replay-step-label');
            const exitReplayBtn = document.getElementById('exit-replay-btn');

            if (totalMoves > 0) {
                replayBar.classList.remove('hidden');
                const currentStep = isReplayMode ? replayIndex : totalMoves;
                replayStepLabel.innerText = `Move ${currentStep} / ${totalMoves}`;
                if (isReplayMode) {
                    exitReplayBtn.classList.remove('hidden');
                } else {
                    exitReplayBtn.classList.add('hidden');
                }
            } else {
                replayBar.classList.add('hidden');
            }

            const historyList = document.getElementById('move-history-list');
            const historyCount = document.getElementById('move-count');
            const fullHistory = game.history({ verbose: true });
            historyCount.innerText = `${fullHistory.length} moves`;

            if (fullHistory.length === 0) {
                historyList.innerHTML = '<div class="text-center text-slate-500 py-8 text-xs italic">No moves played yet</div>';
            } else {
                historyList.innerHTML = '';
                const activeStep = isReplayMode ? replayIndex : fullHistory.length;

                for (let i = 0; i < fullHistory.length; i += 2) {
                    const moveNum = Math.floor(i / 2) + 1;
                    const whiteMove = fullHistory[i] ? fullHistory[i].san : '';
                    const blackMove = fullHistory[i + 1] ? fullHistory[i + 1].san : '';

                    const whiteActive = activeStep === i + 1;
                    const blackActive = activeStep === i + 2;

                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between bg-slate-800/40 px-3 py-1 rounded-lg text-slate-300';

                    const numSpan = document.createElement('span');
                    numSpan.className = 'text-slate-500 font-sans text-xs w-8';
                    numSpan.innerText = `${moveNum}.`;

                    const wSpan = document.createElement('button');
                    wSpan.className = `min-h-[34px] flex-1 text-left px-2 py-1 rounded font-semibold transition-colors ${whiteActive ? 'bg-amber-500/25 text-amber-300' : 'text-slate-200 hover:bg-slate-700/60'}`;
                    wSpan.innerText = whiteMove;
                    wSpan.onclick = () => {
                        if (i + 1 === fullHistory.length && !game.game_over()) exitReplayMode();
                        else enterReplayMode(i + 1);
                    };

                    const bSpan = document.createElement('button');
                    bSpan.className = `min-h-[34px] flex-1 text-left px-2 py-1 rounded font-semibold transition-colors ${blackMove ? (blackActive ? 'bg-amber-500/25 text-amber-300' : 'text-slate-400 hover:bg-slate-700/60') : 'pointer-events-none'}`;
                    bSpan.innerText = blackMove;
                    if (blackMove) {
                        bSpan.onclick = () => {
                            if (i + 2 === fullHistory.length && !game.game_over()) exitReplayMode();
                            else enterReplayMode(i + 2);
                        };
                    }

                    row.appendChild(numSpan);
                    row.appendChild(wSpan);
                    row.appendChild(bSpan);
                    historyList.appendChild(row);
                }

                if (!isReplayMode) {
                    historyList.scrollTop = historyList.scrollHeight;
                }
            }

            updateCapturedPieces(activeBoardGame.history({ verbose: true }));
        }

        function updateCapturedPieces(history) {
            const capturedByTop = document.getElementById('captured-by-top');
            const capturedByBottom = document.getElementById('captured-by-bottom');
            capturedByTop.innerHTML = '';
            capturedByBottom.innerHTML = '';

            const pieceOrder = { q: 1, r: 2, b: 3, n: 4, p: 5 };
            const capturedWhite = [];
            const capturedBlack = [];

            history.forEach(m => {
                if (m.captured) {
                    if (m.color === 'w') {
                        capturedBlack.push(m.captured);
                    } else {
                        capturedWhite.push(m.captured);
                    }
                }
            });

            capturedWhite.sort((a, b) => pieceOrder[a] - pieceOrder[b]);
            capturedBlack.sort((a, b) => pieceOrder[a] - pieceOrder[b]);

            const flipped = isBoardFlipped();
            const topColor = flipped ? 'w' : 'b';
            const bottomColor = flipped ? 'b' : 'w';

            const topCapturedList = topColor === 'w' ? capturedBlack : capturedWhite;
            const bottomCapturedList = bottomColor === 'w' ? capturedBlack : capturedWhite;

            const enemyOfTop = topColor === 'w' ? 'b' : 'w';
            const enemyOfBottom = bottomColor === 'w' ? 'b' : 'w';

            topCapturedList.forEach(piece => {
                const img = document.createElement('img');
                img.src = pieceSvgs[enemyOfTop][piece];
                img.className = 'w-4 h-4 sm:w-5 sm:h-5 object-contain inline-block';
                capturedByTop.appendChild(img);
            });

            bottomCapturedList.forEach(piece => {
                const img = document.createElement('img');
                img.src = pieceSvgs[enemyOfBottom][piece];
                img.className = 'w-4 h-4 sm:w-5 sm:h-5 object-contain inline-block';
                capturedByBottom.appendChild(img);
            });
        }

        function undoMove() {
            if (isReplayMode) {
                exitReplayMode();
            }
            if (isAiThinking || game.history().length === 0) return;

            if (config.mode === 'ai') {
                if (config.playerSide === 'b' && game.history().length < 2) return;

                game.undo();
                if (game.turn() !== config.playerSide && game.history().length > 0) {
                    game.undo();
                }
            } else {
                game.undo();
            }

            replayIndex = game.history().length;
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
            updateUI();
        }

        function restartGame() {
            if (aiMoveTimeout) clearTimeout(aiMoveTimeout);
            stopReplayAutoPlay();
            isAiThinking = false;
            isReplayMode = false;
            replayIndex = 0;
            pendingPromotion = null;

            document.getElementById('game-over-modal').classList.add('hidden');
            document.getElementById('promotion-modal').classList.add('hidden');
            game.reset();
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
            updateUI();

            if (config.mode === 'ai' && config.playerSide === 'b') {
                triggerAIMove();
            }
        }

        function handleGameOver() {
            audio.playGameOver();
            const modal = document.getElementById('game-over-modal');
            const title = document.getElementById('game-over-title');
            const reason = document.getElementById('game-over-reason');

            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'Black' : 'White';
                title.innerText = `${winner} Wins!`;
                reason.innerText = `Victory by checkmate.`;
            } else if (game.in_draw()) {
                title.innerText = `Draw!`;
                if (game.in_stalemate()) {
                    reason.innerText = `Game ended in stalemate.`;
                } else if (game.in_threefold_repetition()) {
                    reason.innerText = `Draw by threefold repetition.`;
                } else if (game.insufficient_material()) {
                    reason.innerText = `Draw by insufficient material.`;
                } else {
                    reason.innerText = `Game ended in a draw.`;
                }
            }
            modal.classList.remove('hidden');
        }

        // --- DESKTOP KEYBOARD SHORTCUTS ---
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('game-page').classList.contains('hidden')) return;

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                replayStepBack();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                replayStepForward();
            } else if (e.key === 'Escape') {
                selectedSquare = null;
                possibleMoves = [];
                document.getElementById('promotion-modal').classList.add('hidden');
                pendingPromotion = null;
                renderBoard();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undoMove();
            }
        });

        window.onload = function() {
            setBoardTheme('wood');
        };
    </script>
</body>
</html>
